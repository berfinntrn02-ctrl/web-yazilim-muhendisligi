  <body>
    <h1>Nefis Krep Tarifi</h1>

    <p>Bu tarif <time datetime="2026-09-2026"></time>tarihinde güncellendi.</p>
    <h2>Malzemeler</h2>
    <ul>
      <li>2 adet yumurta</li>
      <li>2 su bardağı süt</li>
      <li>1.5 su bardağı un</li>
      <li>bir çimdik tuz</li>
    </ul>
    <h2>Yapılışı</h2>
    <ol>
      <li>Tüm malzemeleri derin bir kapta çırpın.</li>
      <li>Krep tavasını hafifçe yağlayın.</li>
      <li>1 kepçe hamur döküp arkalı önlü pişirin.Afiyet olsun.</li>
    </ol>
